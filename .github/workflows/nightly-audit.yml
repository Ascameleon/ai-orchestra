name: Nightly AI ORCHESTRA audit

on:
  schedule:
    # 08:00 UTC = 09:00 in Algeria (Africa/Algiers, UTC+1).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ai-orchestra-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit main branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and verification tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" build

      - name: Lint
        run: ruff check src tests

      - name: Test without live provider calls
        run: pytest -q

      - name: Build distributable package
        run: python -m build

      - name: Verify package metadata
        run: python -c "from importlib.metadata import version; assert version('ai-orchestra') == '0.2.0'; print('Package metadata OK:', version('ai-orchestra'))"
