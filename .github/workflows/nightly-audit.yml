name: Nightly AI ORCHESTRA audit

on:
  schedule:
    # 08:00 UTC = 09:00 in Algeria (Africa/Algiers, UTC+1).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ai-orchestra-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit main branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Lint
        run: ruff check src tests

      - name: Test without live provider calls
        run: pytest -q

      - name: Build distributable package
        run: python -m build

      - name: Verify package metadata
        run: python -c "from importlib.metadata import version; assert version('ai-orchestra') == '0.2.0'; print('Package metadata OK:', version('ai-orchestra'))"

      - name: Build container image
        run: docker build --tag ai-orchestra:nightly-audit .

      - name: Smoke-test container without provider credentials
        run: |
          set -euo pipefail
          docker run -d --name ai-orchestra-nightly -p 127.0.0.1:8766:8000 -e ORCHESTRA_PROVIDER=gemini ai-orchestra:nightly-audit
          trap 'docker logs ai-orchestra-nightly || true; docker rm -f ai-orchestra-nightly || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8766/health", timeout=2) as response:
                      assert response.status == 200
                      break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise SystemExit("container did not become live")
          try:
              urllib.request.urlopen("http://127.0.0.1:8766/ready", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 503
          else:
              raise SystemExit("readiness should fail closed without provider credentials")
          PY

      - name: Audit installed dependencies
        run: |
          python -m pip install pip-audit
          pip-audit
