name: Python CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Build distributable package
        run: python -m build
      - name: Build container image
        run: docker build --tag ai-orchestra:ci .
      - name: Smoke-test container without provider credentials
        run: |
          set -euo pipefail
          docker run -d --name ai-orchestra-smoke -p 127.0.0.1:8765:8000 -e ORCHESTRA_PROVIDER=gemini ai-orchestra:ci
          trap 'docker logs ai-orchestra-smoke || true; docker rm -f ai-orchestra-smoke || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=2) as response:
                      assert response.status == 200
                      break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise SystemExit("container did not become live")
          try:
              urllib.request.urlopen("http://127.0.0.1:8765/ready", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 503
          else:
              raise SystemExit("readiness should fail closed without provider credentials")
          PY
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet
      - name: Dependency security audit
        run: |
          python -m pip install pip-audit
          pip-audit
