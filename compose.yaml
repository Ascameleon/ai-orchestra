services:
  ai-orchestra:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-orchestra:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ORCHESTRA_BUDGET_DB: ${ORCHESTRA_BUDGET_DB:-/data/provider-budget.sqlite3}
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - orchestra-memory:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  orchestra-memory:
